services:
  redis:
    image: redis:7.4-alpine
    container_name: quizwheelz-redis
    restart: unless-stopped
    labels:
      org.springframework.boot.ignore: true
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-quizwheelz-local-redis}"
      ]
    volumes:
      - quizwheelz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-quizwheelz-local-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  quizwheelz_redis_data: