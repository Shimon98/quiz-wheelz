services:
  redis:
    image: redis:7.4-alpine

    ports:
      - "127.0.0.1::6379"

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - quizwheelz_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  quizwheelz_redis_data:
