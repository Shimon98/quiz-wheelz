spring.datasource.url=jdbc:h2:mem:quizwheelz_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

TOKEN_SECRET=test-only-token-secret-must-be-at-least-32-characters

AUTH_COOKIE_SECURE=false

QUIZWHEELZ_REDIS_ENABLED=false
QUIZWHEELZ_REDIS_REQUIRED=false
QUIZWHEELZ_REDIS_REQUIRE_PASSWORD=false
QUIZWHEELZ_REDIS_KEY_PREFIX=quizwheelz:test

management.health.redis.enabled=false

spring.docker.compose.enabled=false

QUIZWHEELZ_DB_MAX_APPLICATION_INSTANCES=1
QUIZWHEELZ_DB_APPLICATION_CONNECTION_BUDGET=64
QUIZWHEELZ_DB_RESERVED_CONNECTIONS=10
