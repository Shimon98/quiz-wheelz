spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

AUTH_COOKIE_SECURE=true
AUTH_COOKIE_SAME_SITE=None

QUIZWHEELZ_REDIS_ENABLED=true
QUIZWHEELZ_REDIS_REQUIRED=true
QUIZWHEELZ_REDIS_REQUIRE_PASSWORD=true
QUIZWHEELZ_REDIS_KEY_PREFIX=quizwheelz:prod

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

management.health.redis.enabled=true

# Production keeps Luck and Hidden Recovery OFF until its own gates close: the race_player_recovery_states DDL, a real
# connection budget and the security review (docs/01-server/reviews/s4-04-c2/C2_DB_BUDGET_AND_RELEASE_GATES_EN.md).
# It declares no Luck connection budget, so Luck switched on here without real numbers refuses to start.
QUIZWHEELZ_LUCK_ANSWER_ENABLED=false
QUIZWHEELZ_RECOVERY_ENABLED=false
