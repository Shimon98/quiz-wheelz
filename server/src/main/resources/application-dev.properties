spring.datasource.url=jdbc:mysql://localhost:3306/quiz_wheelz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jerusalem
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

TOKEN_SECRET=dev-only-local-token-secret-must-not-be-used-in-production-12345

AUTH_COOKIE_SECURE=false

# Redis runtime policy
QUIZWHEELZ_REDIS_ENABLED=true
QUIZWHEELZ_REDIS_REQUIRED=true
QUIZWHEELZ_REDIS_REQUIRE_PASSWORD=false
QUIZWHEELZ_REDIS_KEY_PREFIX=quizwheelz:dev

management.health.redis.enabled=true

# Automatic local Redis infrastructure
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.timeout=60s
