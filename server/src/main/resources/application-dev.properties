spring.datasource.url=jdbc:mysql://localhost:3306/quiz_wheelz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jerusalem
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

TOKEN_SECRET=dev-only-local-token-secret-must-not-be-used-in-production-12345

AUTH_COOKIE_SECURE=false

# Redis runtime policy
QUIZWHEELZ_REDIS_ENABLED=true
QUIZWHEELZ_REDIS_REQUIRED=true
QUIZWHEELZ_REDIS_REQUIRE_PASSWORD=false
QUIZWHEELZ_REDIS_KEY_PREFIX=quizwheelz:dev

management.health.redis.enabled=true

# S4-05 Hidden Recovery and S4-04 Luck are ON for every normal run since 2026-11-05: their switches live in
# application.properties (one owner), and an environment variable still switches each off. The code defaults stay false.
# Luck reads classmates through its own small pool, and the server refuses to start unless the pools fit a declared
# budget (LuckStartupVerifier): instances x (writer pool + Luck pool) <= budget, and budget + reserved <= the real MySQL
# @@max_connections. One local server: 1 x (10 + 2) = 12 <= 20, and 20 + 5 = 25 (a stock MySQL 8 allows 151).
# These are local numbers only: no other profile inherits them.
spring.datasource.hikari.maximum-pool-size=10
QUIZWHEELZ_LUCK_PEER_POOL_MAX_SIZE=2
QUIZWHEELZ_DB_MAX_APPLICATION_INSTANCES=1
QUIZWHEELZ_DB_APPLICATION_CONNECTION_BUDGET=20
QUIZWHEELZ_DB_RESERVED_CONNECTIONS=5

# Automatic local Redis infrastructure
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.timeout=60s
