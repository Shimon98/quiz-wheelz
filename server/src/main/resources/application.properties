spring.application.name=Quiz_Wheelz
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

TOKEN_EXPIRATION_MINUTES=120

AUTH_COOKIE_NAME=AUTH_TOKEN
AUTH_COOKIE_MAX_AGE_SECONDS=7200
AUTH_COOKIE_SAME_SITE=Lax

RACE_PLAYER_COOKIE_NAME=RACE_PLAYER_TOKEN
RACE_PLAYER_COOKIE_MAX_AGE_SECONDS=7200

spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000}
spring.data.redis.repositories.enabled=false

QUIZWHEELZ_TIME_ZONE=Asia/Jerusalem

# Gameplay features of every normal run: S4-04 Luck with the Guard Shield, S4-05 Hidden Recovery.
# Each one switches off on its own with an environment variable, which beats this file and every profile file:
#   QUIZWHEELZ_LUCK_ANSWER_ENABLED=false    QUIZWHEELZ_RECOVERY_ENABLED=false
# Luck also needs a declared connection budget (application-dev.properties for the normal run); the test and prod
# profiles switch both off on purpose.
QUIZWHEELZ_LUCK_ANSWER_ENABLED=true
QUIZWHEELZ_RECOVERY_ENABLED=true
